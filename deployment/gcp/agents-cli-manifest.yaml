name: booking-agent-gcp
acli_version: 1.15.0
agent_directory: booking_agent
region: us-central1
base_template: adk_python
language: python
framework: google-adk
create_params:
  root_agent_name: booking_agent
  app_name: booking_agent
  deployment_target: agent_runtime
  session_type: none
  cicd_runner: skip
  is_a2a: true
  agent_guidance_filename: README.md
  agent_runtime:
    identity_default: service_account
  cloud_run:
    identity_default: service_account
