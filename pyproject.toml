[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk-json-booking-agent"
version = "0.1.0"
description = "GPT-5.2 ADK appointment agent with A2A and transactional JSON storage"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-adk[a2a]==2.14.1", "a2a-sdk==1.3.1", "litellm==1.109.1",
  "fastapi==0.164.0", "uvicorn==0.54.0", "filelock==4.2.12",
  "httpx[socks]==0.28.1", "pydantic==2.14.3", "python-dotenv==1.2.4",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.5"]
eval = ["google-adk[eval]==2.14.1", "google-agents-cli==1.15.0"]
spec = ["specify-cli==1.4.2"]
cli = ["google-agents-cli==1.15.0"]

[tool.hatch.build.targets.wheel]
packages = ["booking_agent", "coordinator", "eval_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires paid model credentials"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".specify", ".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
